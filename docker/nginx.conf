server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

  # Le service worker et la page doivent toujours être revalidés pour que les mises à jour arrivent.
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest {
    types {}
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location / { try_files $uri $uri/ /index.html; }
}
