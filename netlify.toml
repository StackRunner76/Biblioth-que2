# Déploiement Netlify : site statique construit à la racine du dépôt (monorepo npm workspaces).
# Laisser « Base directory » vide dans l'interface Netlify.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Le service worker doit toujours être revalidé pour que les mises à jour arrivent.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
